<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- タイトルを「Support」にしない。AI の引用面にも検索にも載らなくなる（他アプリで実測） -->
<title>血圧おぼえ帳 — 診察に持っていく血圧手帳</title>
<meta name="description" content="朝と晩に測った血圧を入れておくと、診察にそのまま持っていける紙の血圧手帳（A4）になります。日本高血圧学会 高血圧管理・治療ガイドライン2025の目安を併記。血圧の値はiPhoneから出ません。">
<meta property="og:title" content="血圧おぼえ帳 — 診察に持っていく血圧手帳">
<meta property="og:description" content="朝晩の血圧を3秒で記録して、診察にそのまま持っていける血圧手帳（PDF）を作れます。データは一切収集しません。">
<meta property="og:url" content="https://nosunosukawa.github.io/bpnote-site/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://nosunosukawa.github.io/bpnote-site/">
<style>
/* ============================================================
   血圧おぼえ帳 — LP
   配色・角丸・罫の太さは、アプリ本体 BPNote/Design/Paper.swift の
   トークンをそのまま持ってきている。画面と地続きに見えることが信用になる。
   Paper.swift の禁止事項も守る:
     グラデーション / ぼかし / 影付きカードの列 / 角丸4pt超 / 絵文字アイコン
   階層は「罫と余白」だけで作る。
   ============================================================ */
:root{
  --paper:#FAF7F0;      /* Paper.ground */
  --rule:#D9D2C5;       /* Paper.rule */
  --ink:#2B2A28;        /* Paper.ink */
  --ink-2:#5C5850;      /* 薄墨。紙地に対し 6.5:1 */
  --morning:#FDF3D8;    /* Paper.morningBand */
  --evening:#E8EDF5;    /* Paper.eveningBand */
  --red:#C0392B;        /* Paper.vermilion（線・帯） */
  --red-ink:#C0392B;    /* 同（文字）。紙地に対し 5.1:1 */
  --indigo:#2F4F7F;     /* Paper.tint(.indigo)。紙地に対し 7.7:1 */
  --hair:1px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#1C1A17; --rule:#3A3630; --ink:#EDE8DE;
    /* Paper.swift の #A69F92 は暗地で 3.6:1 しか無いので、本文用に上げる */
    --ink-2:#C3BCAD;
    --morning:#2E2A1F; --evening:#1F2530;
    --red:#E06B5C;
    /* Paper.swift の #E06B5C は暗地で 2.9:1。文字だけ 4.6:1 まで上げる */
    --red-ink:#F0A093;
    /* Paper.swift の #8CA8D4 は暗地で 4.0:1。リンクは本文サイズなので上げる */
    --indigo:#A8C0E4;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  /* 本文は角ゴ。50〜80代の画面での可読性はゴシックが上 */
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Yu Gothic Medium",
              "Noto Sans JP",system-ui,sans-serif;
  font-size:19px;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
}
/* 見出しは明朝。医院の掲示・学会・紙の手帳の見出しの語彙 */
.mincho{
  font-family:"Hiragino Mincho ProN","Toppan Bunkyu Mincho","YuMincho","Yu Mincho",
              "Noto Serif JP",serif;
  font-weight:600;
}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

a{color:var(--indigo);text-decoration:underline;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:3px solid var(--indigo);outline-offset:3px;border-radius:2px}

/* ---- 上部の帯。App Store の必須URL（サポート・プライバシー）へ、
       スクロールせずに届く位置に置く ---- */
.top{border-bottom:var(--hair) solid var(--rule)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;
  padding-top:6px;padding-bottom:6px}
.brand{font-size:20px;letter-spacing:.02em;margin-right:auto}
.top a{display:inline-flex;align-items:center;min-height:44px;
  font-size:17px;text-decoration:none;border-bottom:2px solid transparent}
.top a:hover{border-bottom-color:var(--indigo)}

/* ---- 節。1つの節の中身は「小さな見出し → 絵 → キャプション」 ---- */
section{border-bottom:var(--hair) solid var(--rule);padding:30px 0 36px}
section.morning{background:var(--morning)}
section.evening{background:var(--evening)}

/* 節の目印は 01/02/03 ではなくアプリの画面名。順番に意味は無いので連番は嘘になる */
.eyebrow{
  font-size:16px;font-weight:600;letter-spacing:.22em;color:var(--ink-2);
  display:flex;align-items:center;gap:10px;margin-bottom:14px
}
.eyebrow::after{content:"";flex:1;height:var(--hair);background:var(--rule)}

h1{font-size:clamp(30px,8.5vw,44px);line-height:1.25;letter-spacing:.01em}
.lead{font-size:19px;margin-top:12px}
.capline{font-size:clamp(23px,6.2vw,31px);line-height:1.4;margin-top:18px;display:block}
.cap{font-size:18px;margin-top:8px;display:block}
.note{font-size:17px;color:var(--ink-2);margin-top:6px;display:block;line-height:1.7}

figure{margin:0}
figure svg{display:block;width:100%;height:auto}
.hero figure{margin-top:20px}

/* ---- 図の中の描画（SVG は外側の CSS を継承する） ---- */
.s-rule{stroke:var(--rule);stroke-width:1;fill:none}
.s-ink{stroke:var(--ink);stroke-width:1.4;fill:none}
.s-red{stroke:var(--red);stroke-width:2;fill:none}
.f-paper{fill:var(--paper)}
.f-morning{fill:var(--morning)}
.f-evening{fill:var(--evening)}
.f-ink{fill:var(--ink)}
.f-ink2{fill:var(--ink-2)}
.f-onink{fill:var(--paper)}   /* 墨地のボタンに載る文字 */
.t{fill:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif}
.t2{fill:var(--ink-2);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif}
.tn{fill:var(--ink);font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif;
    font-variant-numeric:tabular-nums}
.tr{fill:var(--red-ink);font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif;
    font-variant-numeric:tabular-nums}
.tm{fill:var(--ink);font-family:"Hiragino Mincho ProN","YuMincho","Yu Mincho",serif}
.mid{text-anchor:middle}
.end{text-anchor:end}

/* ---- だいじなこと（免責）。朱の罫で囲む。弱めない ---- */
.caution{border-top:3px solid var(--red);border-bottom:var(--hair) solid var(--rule);
  padding:28px 0 32px}
.caution h2{font-size:26px;line-height:1.4}
.caution p{font-size:18px;margin-top:12px}
.emg{font-size:22px;font-weight:700;color:var(--red-ink);line-height:1.5}

/* ---- フッタ。連絡先とプライバシーは必ずここにも置く ---- */
footer{padding:28px 0 56px}
.links{display:flex;flex-direction:column;gap:0;margin-bottom:20px}
.links a{display:flex;align-items:center;min-height:56px;font-size:18px;
  text-decoration:none;border-bottom:var(--hair) solid var(--rule);word-break:break-word}
.links a::after{content:"›";margin-left:auto;padding-left:10px;font-size:22px;color:var(--ink-2)}
.links a:hover{background:var(--morning)}
.copy{font-size:16px;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <span class="brand mincho">血圧おぼえ帳</span>
    <a href="support.html">つかい方</a>
    <a href="privacy.html">プライバシー</a>

</div>

<main>

  <!-- ===== ヒーロー = 出口（診察に持っていく手帳）。入力画面ではない。

          <text x="130" y="98" class="tn mid" font-size="13">72</text>
          <text x="156" y="98" class="t2 mid" font-size="11">前</text>
          <text x="208" y="98" class="tn mid" font-size="16">129/79</text>

      </figure>
    </div>
  </section>

  <!-- ===== 入力 ===== -->

          <text x="150" y="253" class="tm mid" font-size="26" font-weight="600">2</text>

          <text x="150" y="293" class="tm mid" font-size="26" font-weight="600">5</text>

  <!-- ===== 測り方。読者の不安2番目「測り方が合っているか分からない」への答え ===== -->
  <section class="evening">
    <div class="wrap">
      <h2 class="eyebrow">測り方</h2>
      <figure>
        <svg viewBox="0 0 300 140" role="img"
             aria-label="朝は起きて1時間以内、晩は寝る前に測ることを示した2枚の絵。">
